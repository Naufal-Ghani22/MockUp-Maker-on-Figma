<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 0; padding: 14px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  h2 { font-size: 13px; margin: 14px 0 8px; }
  h2:first-child { margin-top: 0; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  select, input[type=text], input[type=number] { width: 150px; padding: 4px 6px; border: 1px solid var(--figma-color-border, #ccc); border-radius: 4px; background: transparent; color: inherit; font: inherit; }
  input[type=color] { width: 40px; height: 24px; border: none; padding: 0; background: none; }
  .swatches { display: flex; gap: 6px; margin: 6px 0 4px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  .sw.on { border-color: #31B3B0; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { padding: 3px 8px; border-radius: 10px; border: 1px solid var(--figma-color-border, #ccc); background: transparent; color: inherit; cursor: pointer; font: inherit; }
  #boardOpts.hide { display: none; }
  #go { width: 100%; margin-top: 16px; padding: 10px; border: none; border-radius: 6px; background: #31B3B0; color: #fff; font-weight: 600; cursor: pointer; }
  .hint { opacity: .65; margin-top: 8px; line-height: 1.4; }
</style>

<h2>Perangkat</h2>
<label>Model
  <select id="model">
    <option value="iphone15">iPhone 15</option>
    <option value="iphone15pro" selected>iPhone 15 Pro</option>
    <option value="iphone15promax">iPhone 15 Pro Max</option>
    <option value="iphone16">iPhone 16</option>
    <option value="iphone16pro">iPhone 16 Pro</option>
    <option value="iphone16promax">iPhone 16 Pro Max</option>
  </select>
</label>
<div>Warna bodi</div>
<div class="swatches" id="colors">
  <div class="sw on" data-c="natural" style="background:#BEB8AE" title="Natural Titanium"></div>
  <div class="sw" data-c="black" style="background:#3B3B3D" title="Black Titanium"></div>
  <div class="sw" data-c="white" style="background:#EDECE8" title="White Titanium"></div>
  <div class="sw" data-c="desert" style="background:#C2A68E" title="Desert Titanium"></div>
  <div class="sw" data-c="blue" style="background:#3E4757" title="Blue Titanium"></div>
  <div class="sw" data-c="midnight" style="background:#1C1C1E" title="Midnight"></div>
</div>
<label>Dynamic Island <input type="checkbox" id="island" checked></label>
<label>Bayangan <input type="checkbox" id="shadow" checked></label>
<label>Kilap layar <input type="checkbox" id="glare"></label>
<label>Tinggi layar ikut frame (long screen) <input type="checkbox" id="fullHeight"></label>
<label>Pakai instance (jika frame = component) <input type="checkbox" id="link" checked></label>
<label>Rotasi (°) <input type="number" id="rotation" value="0" step="1"></label>
<label>Jarak antar HP <input type="number" id="gap" value="80"></label>

<h2>Papan Showcase</h2>
<label>Buat papan latar <input type="checkbox" id="board" checked></label>
<div id="boardOpts">
  <div class="presets">
    <button data-p="#31B3B0,#7EDDC6,0">Siswa</button>
    <button data-p="#13336E,#638EE1,0">Guru</button>
    <button data-p="#852BFF,#638EE1,0">Ungu</button>
    <button data-p="#F4F6FA,,1">Terang</button>
    <button data-p="#0F1115,,0">Gelap</button>
  </div>
  <label>Warna 1 <input type="color" id="bg1" value="#31B3B0"></label>
  <label>Warna 2 (gradien) <span><input type="checkbox" id="useBg2" checked> <input type="color" id="bg2" value="#7EDDC6"></span></label>
  <label>Teks gelap <input type="checkbox" id="darkText"></label>
  <label>Judul <input type="text" id="title" placeholder="mis. Alur Belajar Siswa"></label>
  <label>Subjudul <input type="text" id="subtitle" placeholder="opsional"></label>
  <label>Sudut membulat <input type="checkbox" id="boardRadius" checked></label>
</div>

<button id="go">Buat Mockup dari Frame Terpilih</button>
<div class="hint">Pilih satu atau beberapa frame layar (urut kiri → kanan), lalu klik tombol. Frame asli tidak diubah.</div>

<script>
  const $ = (id) => document.getElementById(id);
  let color = "natural";
  document.querySelectorAll(".sw").forEach((el) => el.onclick = () => {
    document.querySelectorAll(".sw").forEach((x) => x.classList.remove("on"));
    el.classList.add("on"); color = el.dataset.c;
  });
  document.querySelectorAll(".presets button").forEach((b) => b.onclick = () => {
    const [a, c, dark] = b.dataset.p.split(",");
    $("bg1").value = a;
    $("useBg2").checked = !!c;
    if (c) $("bg2").value = c;
    $("darkText").checked = dark === "1";
  });
  $("board").onchange = () => $("boardOpts").classList.toggle("hide", !$("board").checked);
  $("go").onclick = () => parent.postMessage({ pluginMessage: { type: "build", options: {
    model: $("model").value, color,
    island: $("island").checked, shadow: $("shadow").checked, glare: $("glare").checked,
    fullHeight: $("fullHeight").checked, link: $("link").checked,
    rotation: Number($("rotation").value) || 0, gap: Number($("gap").value) || 0,
    board: $("board").checked, bg1: $("bg1").value, bg2: $("useBg2").checked ? $("bg2").value : null,
    darkText: $("darkText").checked, title: $("title").value.trim(), subtitle: $("subtitle").value.trim(),
    boardRadius: $("boardRadius").checked
  } } }, "*");
</script>
